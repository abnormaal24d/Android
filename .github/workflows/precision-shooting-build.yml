name: Precision Shooting APK

on:
  push:
    branches:
      - build/precision-shooting-v1.2

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        shell: bash
        run: gradle -p PrecisionShooting --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="PrecisionShooting/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          mkdir -p artifact
          cp "$APK" artifact/PrecisionShooting-v1.2-debug.apk
          sha256sum artifact/PrecisionShooting-v1.2-debug.apk | tee artifact/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrecisionShooting-v1.2-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 7
